name: 更新公募基金数据

on:
  schedule:
    # 每天北京时间18:30运行（UTC时间10:30），基金净值一般在17:00-18:00更新完成
    - cron: '30 10 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # 缓存pip依赖，加快运行速度
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行数据获取脚本
      run: python scrape_funds.py
      
    - name: 提交并推送更新
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/
        git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新基金数据 $(date +'%Y-%m-%d %H:%M')" && git push)